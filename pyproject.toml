[project]
name = "roco-medsam-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aalavikhan", email = "aalavimkhan@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "torchaudio==2.5.1+cu121",
    "open-clip-torch>=3.3.0",
    "transformers==4.40.0",
    "timm>=1.0.26",
    "einops>=0.8.2",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "albumentations>=2.0.8",
    "pot>=0.9.6.post1",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "tqdm>=4.67.3",
    "pyyaml>=6.0.3",
    "wandb>=0.27.0",
    "numpy<2",
    "pyarrow>=15,<18",
    "datasets>=2.19,<3",
    "entmax",
    "matplotlib",
    "scikit-image",
    "simpleitk",
    "opencv-python",
    "huggingface-hub>=0.36.2",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]

[project.scripts]
roco-medsam-test = "roco_medsam_test:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
